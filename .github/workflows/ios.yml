name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project YunX.xcodeproj \
            -scheme YunX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Package unsigned IPA
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/YunX.app"
          test -d "$APP" || { echo "没找到 YunX.app"; ls -R ios/build/Build/Products || true; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry YunX-unsigned.ipa Payload
          ls -lh YunX-unsigned.ipa
          echo "IPA 已生成：用 Sideloadly / AltStore 签名安装" >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunX-unsigned-ipa
          path: YunX-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
